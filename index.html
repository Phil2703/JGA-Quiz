<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c8552a">
<title>7 vs. Martin Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css?v=11">
</head><body>

<div class="hero" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="topbar">
      <span class="pill" id="pillL" hidden></span>
      <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
      <span class="pill light" id="pillR" hidden></span>
    </div>
    <img class="logo" src="assets/logo.webp" alt="7 vs. Martin" width="88" height="88">
  </header>
  <main id="app"><section class="qcard"><p class="muted" style="margin:0">Lädt …</p></section></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=11"></script>
<script src="assets/common.js?v=11"></script>
<script>
(function(){
  const { LETTERS, esc, h, ls, configured, db, renderNotConfigured, renderError } = window.JGA;
  if(!configured) return renderNotConfigured();

  const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  function top(left, right, pct){
    $("pillL").hidden = !left; $("pillL").innerHTML = left ? ICON + esc(left) : "";
    $("pillR").hidden = !right; $("pillR").textContent = right || "";
    $("barWrap").hidden = pct == null; $("bar").style.width = (pct || 0) + "%";
  }
  const isMartin = () => st.name === "Martin";
  const title = () => isMartin() ? "Wie gut kennst du dich?" : "Wie gut kennst du Martin?";
  // Antwortreihenfolge pro Spieler und Frage mischen (fest je Name + Frage, damit sie beim Zurückblättern gleich bleibt)
  function order(name, qid){
    let x = 2166136261; for(const c of name + "#" + qid){ x ^= c.charCodeAt(0); x = Math.imul(x, 16777619); }
    const rnd = () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };
    const a = [0,1,2,3]; for(let k = 3; k > 0; k--){ const r = Math.floor(rnd() * (k + 1)); [a[k], a[r]] = [a[r], a[k]]; }
    return a;
  }
  const KEY = "7vm-player";
  let players = [], questions = [];
  let st = ls.get(KEY) || { name:"", a:{}, i:0, done:false };
  const save = () => ls.set(KEY, st);
  const complete = q => q.active && q.text.trim() && Array.isArray(q.options) && q.options.length === 4 && q.options.every(o => String(o).trim());

  async function load(){
    try{
      [players, questions] = await Promise.all([db.players(), db.questions()]);
      questions = questions.filter(complete);
      if(!questions.length){
        h(`<section class="qcard"><h1>Noch keine Fragen</h1><p class="muted lead">Das Quiz ist noch nicht freigeschaltet. Schau später nochmal rein.</p></section>`);
        return;
      }
      // Antworten auf Fragen, die es nicht mehr gibt, verwerfen
      const ids = new Set(questions.map(q => String(q.id)));
      Object.keys(st.a).forEach(k => { if(!ids.has(k)) delete st.a[k]; });
      if(st.i >= questions.length) st.i = 0;
      if(!players.some(p => p.name === st.name)) st.name = "";
      save();
      if(st.done) screenDone(); else if(st.name && Object.keys(st.a).length) screenQ(); else screenName();
    }catch(e){ renderError(e, load); }
  }

  function screenName(){
    top();
    h(`
      <section class="qcard">
      <h1 id="title">${title()}</h1>
      <p class="muted lead">${questions.length} Fragen. Nur Franzi kennt die richtigen Antworten. Wer Martin am besten kennt, gewinnt den Joker fürs Wochenende. Was er kann, erfährst du am Feuer. Martin: Du spielst gegen dich selbst – mal sehen, ob sie dich besser kennt als du dich.</p>
      </section>
      <h2>Wer bist du?</h2>
      <div class="chips" id="names">${players.map(p=>`<button class="chip ${st.name===p.name?"on":""}" data-n="${esc(p.name)}">${esc(p.name)}</button>`).join("")}</div>
      <div class="nav"><span></span><button class="primary" id="start" ${st.name?"":"disabled"}>Los geht's →</button></div>
    `);
    document.getElementById("names").onclick = e => {
      const b = e.target.closest(".chip"); if(!b) return;
      st.name = b.dataset.n; save();
      document.querySelectorAll("#names .chip").forEach(c => c.classList.toggle("on", c === b));
      $("title").textContent = title();
      $("start").disabled = false;
    };
    document.getElementById("start").onclick = () => { st.i = 0; save(); screenQ(); };
  }

  function screenQ(){
    const i = st.i, q = questions[i], n = questions.length, sel = st.a[q.id];
    top(st.name, `${pad(i+1)} von ${pad(n)}`, Math.round((i+1)/n*100));
    h(`
      <section class="qcard">
        <div class="kicker">Frage <b>${pad(i+1)}</b></div>
        <div class="sub">${title()}</div>
        <hr class="dots">
        <p class="qtext">${esc(q.text)}</p>
      </section>
      <div class="opts" id="opts" role="radiogroup">${order(st.name, q.id).map((j,pos)=>`<button class="opt ${sel===j?"on":""}" data-j="${j}" role="radio" aria-checked="${sel===j}"><b>${LETTERS[pos]}</b><span class="body">${esc(q.options[j])}</span><i class="tick">✓</i></button>`).join("")}</div>
      <div class="nav">
        <button class="round" id="back" aria-label="${i===0?"Name ändern":"Zurück"}">←</button>
        <button class="primary" id="next" ${sel!==undefined?"":"disabled"}>${i===n-1?"Abschicken":"Weiter →"}</button>
      </div>
    `);
    document.getElementById("opts").onclick = e => {
      const b = e.target.closest(".opt"); if(!b) return;
      st.a[q.id] = +b.dataset.j; save();
      document.querySelectorAll("#opts .opt").forEach(o => { const on = o === b; o.classList.toggle("on", on); o.setAttribute("aria-checked", on); });
      $("next").disabled = false;
    };
    document.getElementById("back").onclick = () => { if(i===0) screenName(); else { st.i--; save(); screenQ(); } };
    document.getElementById("next").onclick = () => { if(i===n-1) submit(); else { st.i++; save(); screenQ(); } };
  }

  async function submit(){
    const missing = questions.filter(q => st.a[q.id] === undefined);
    if(missing.length){ st.i = questions.indexOf(missing[0]); save(); return screenQ(); }
    h(`<section class="qcard"><p class="muted" style="margin:0">Wird abgeschickt …</p></section>`);
    try{
      await db.submit(st.name, st.a);
      st.done = true; save(); screenDone();
    }catch(e){ renderError(e, submit); }
  }

  function screenDone(){
    top(st.name, "Fertig", 100);
    h(`
      <section class="qcard">
        <span class="stamp">Abgegeben</span>
        <h1 style="margin-top:14px">Danke, ${esc(st.name)}!</h1>
        <p class="muted lead">Deine Antworten sind gespeichert. Die Auflösung gibt's Freitagabend am Feuer.</p>
      </section>
      <div class="stack" style="margin-top:18px">
        <button class="ghost" id="edit">Antworten nochmal ansehen oder ändern</button>
        <button class="ghost" id="reset">Nicht ${esc(st.name)}? Neu starten</button>
      </div>
    `);
    document.getElementById("edit").onclick = () => { st.i = 0; st.done = false; save(); screenQ(); };
    document.getElementById("reset").onclick = () => { if(confirm("Name und Antworten auf diesem Gerät löschen? Die Abgabe in der Datenbank bleibt.")){ st = { name:"", a:{}, i:0, done:false }; save(); screenName(); } };
  }

  load();
})();
</script>
</body></html>
