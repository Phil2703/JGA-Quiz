  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => String(s || "").toLowerCase().replace(/\s+/g, "");
  async function open(code){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(code)), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(D.s), iterations:D.n, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);

    document.getElementById("app").innerHTML = new TextDecoder().decode(buf);
    window.scrollTo(0,0);
  }
  const KEY = "7vm-lage2";
  let saved = null; try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved) open(saved).catch(() => { try{ localStorage.removeItem(KEY); }catch(e){} });
  document.getElementById("gate").onsubmit = async e => {

    const v = document.getElementById("code").value, btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "…";
    try{ await open(v); try{ localStorage.setItem(KEY, norm(v)); }catch(e){} }
