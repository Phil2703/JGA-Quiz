  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => String(s || "").toLowerCase().replace(/\s+/g, "");
  async function open(code){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(code)), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(D.s), iterations:D.n, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(D.i) }, key, b64(D.c));
    document.getElementById("app").innerHTML = new TextDecoder().decode(buf);
    window.scrollTo(0,0);
    quizTimer();
  }
  // Knopf "Zum Quiz": zählt bis zur Freigabe herunter. Die Zeit kommt aus derselben Einstellung wie das Quiz selbst.
  async function quizTimer(){
    const btn = document.getElementById("quizBtn"), cfg = window.JGA_CONFIG || {};
    if(!btn || !cfg.SUPABASE_URL) return;
    let openAt;
    try{
      const r = await fetch(cfg.SUPABASE_URL + "/rest/v1/settings?select=quiz_open_at&id=eq.1", { headers:{ apikey: cfg.SUPABASE_ANON_KEY } });
      const rows = await r.json(); openAt = rows[0] && new Date(rows[0].quiz_open_at);
    }catch(e){ return; }            // ohne Verbindung bleibt es ein normaler Link
    if(!openAt || isNaN(openAt)) return;
    const p2 = n => String(n).padStart(2, "0");
    const tick = () => {
      const ms = openAt - Date.now();
      if(ms <= 0){ clearInterval(iv); btn.textContent = "Zum Quiz →"; btn.removeAttribute("aria-disabled"); btn.style.pointerEvents = ""; btn.style.opacity = ""; return; }
      const s = Math.floor(ms/1000), d = Math.floor(s/86400);
      btn.textContent = "Quiz öffnet in " + (d ? d + (d===1 ? " Tag " : " Tagen ") : "") + [Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60].map(p2).join(":");
      btn.setAttribute("aria-disabled", "true"); btn.style.pointerEvents = "none"; btn.style.opacity = ".55";
    };
    const iv = setInterval(tick, 1000); tick();
  }
  const KEY = "7vm-lage2";
  let saved = null; try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved) open(saved).catch(() => { try{ localStorage.removeItem(KEY); }catch(e){} });
  document.getElementById("gate").onsubmit = async e => {
    e.preventDefault();
    const v = document.getElementById("code").value, btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "…";
    try{ await open(v); try{ localStorage.setItem(KEY, norm(v)); }catch(e){} }
    catch(err){ document.getElementById("err").hidden = false; btn.disabled = false; btn.textContent = "Öffnen"; }
  };
})();
</script>
